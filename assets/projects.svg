<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Space Grotesk', Helvetica, Arial, sans-serif">
  <rect width="900" height="300" rx="14" fill="#131517"/>
  <rect x="1" y="1" width="898" height="298" rx="13" fill="none" stroke="#2b2e32" stroke-width="1"/>

  <text x="34" y="48" font-size="24" font-weight="700" fill="#d1fe17">🚀 Projects</text>
  <line x1="34" y1="64" x2="866" y2="64" stroke="#2b2e32" stroke-width="1"/>

  <line x1="450" y1="80" x2="450" y2="276" stroke="#2b2e32" stroke-width="1"/>

  <!-- FileMind -->
  <text x="34" y="100" font-size="17" font-weight="700" fill="#f5f5f4">FileMind</text>
  <g font-size="13.5" fill="#d3d1cc">
    <text x="34" y="126">Full-stack AI Bot-as-a-Service platform —</text>
    <text x="34" y="146">upload PDFs through a RabbitMQ pipeline (S3</text>
    <text x="34" y="166">→ pypdf → OpenAI embeddings → Qdrant) to</text>
    <text x="34" y="186">spin up embeddable RAG chatbots with real-</text>
    <text x="34" y="206">time chat over FastAPI + Socket.IO.</text>
  </g>
  <text x="34" y="240" font-size="12" fill="#9a978f" font-family="'JetBrains Mono','Fira Code',monospace">FastAPI · Next.js · PostgreSQL · Prisma</text>
  <text x="34" y="258" font-size="12" fill="#9a978f" font-family="'JetBrains Mono','Fira Code',monospace">RabbitMQ · Qdrant · OpenAI</text>

  <!-- Doc-Delta -->
  <text x="482" y="100" font-size="17" font-weight="700" fill="#f5f5f4">Doc-Delta</text>
  <g font-size="13.5" fill="#d3d1cc">
    <text x="482" y="126">Event-driven platform that analyzes code</text>
    <text x="482" y="146">changes and auto-publishes technical</text>
    <text x="482" y="166">documentation to Notion via agent</text>
    <text x="482" y="186">orchestration — cutting doc overhead by 90%</text>
    <text x="482" y="206">while staying real-time accurate.</text>
  </g>
  <text x="482" y="240" font-size="12" fill="#9a978f" font-family="'JetBrains Mono','Fira Code',monospace">FastAPI · GitHub Webhooks · Notion API</text>
  <text x="482" y="258" font-size="12" fill="#9a978f" font-family="'JetBrains Mono','Fira Code',monospace">OpenAI Agents SDK</text>
</svg>
